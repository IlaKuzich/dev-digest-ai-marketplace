<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DevDigest AI Marketplace</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --fg: #1a1a1a;
    --muted: #666666;
    --card-bg: #f6f6f7;
    --border: #e2e2e2;
    --accent: #2f6fed;
    --code-bg: #eef1f6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115;
      --fg: #e8e8e8;
      --muted: #9a9a9a;
      --card-bg: #1a1d24;
      --border: #2a2e37;
      --accent: #7aa2ff;
      --code-bg: #12141a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 2.5rem 1.25rem 4rem;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    line-height: 1.5;
  }
  main { max-width: 860px; margin: 0 auto; }
  h1 { font-size: 1.75rem; margin-bottom: 0.25rem; }
  .subtitle { color: var(--muted); margin-top: 0; margin-bottom: 2rem; }
  .grid { display: grid; gap: 1rem; }
  .card {
    border: 1px solid var(--border);
    background: var(--card-bg);
    border-radius: 10px;
    padding: 1.1rem 1.3rem;
  }
  .card h2 { margin: 0 0 0.25rem; font-size: 1.15rem; }
  .card .desc { margin: 0.25rem 0 0.6rem; }
  .card .excerpt { color: var(--muted); font-size: 0.92rem; margin: 0 0 0.75rem; }
  .badge {
    display: inline-block;
    font-size: 0.72rem;
    font-weight: 600;
    padding: 0.1rem 0.5rem;
    border-radius: 999px;
    background: var(--border);
    color: var(--muted);
    margin-right: 0.35rem;
  }
  .badge.placeholder { background: #f5c94222; color: #b8860b; }
  .tags { margin-bottom: 0.6rem; }
  code {
    background: var(--code-bg);
    padding: 0.15rem 0.4rem;
    border-radius: 5px;
    font-size: 0.85rem;
  }
  .install-row { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
  .empty { color: var(--muted); font-style: italic; }
  a { color: var(--accent); }
  footer { margin-top: 3rem; color: var(--muted); font-size: 0.85rem; }
</style>
</head>
<body>
<main>
  <h1>DevDigest AI Marketplace</h1>
  <p class="subtitle">Claude Code plugins maintained independently of the DevDigest product — own versioning, own release cadence.</p>
  <div id="grid" class="grid" aria-live="polite">
    <p class="empty">Loading…</p>
  </div>
  <footer>
    Generated from <code>.claude-plugin/marketplace.json</code> by <code>scripts/build-index.mjs</code>.
    See <a href="https://github.com/IlaKuzich/dev-digest-ai-marketplace">the repository</a> for source, docs, and contribution guidelines.
  </footer>
</main>
<script>
  async function render() {
    const grid = document.getElementById("grid");
    let data;
    try {
      const res = await fetch("./index.json", { cache: "no-store" });
      data = await res.json();
    } catch (err) {
      grid.innerHTML = '<p class="empty">Could not load the plugin index.</p>';
      return;
    }

    const plugins = data.plugins ?? [];
    if (plugins.length === 0) {
      grid.innerHTML = '<p class="empty">No plugins published yet.</p>';
      return;
    }

    grid.innerHTML = plugins.map(renderCard).join("");
  }

  function renderCard(p) {
    const isPlaceholder = !p.version || p.version === "0.0.0";
    const versionBadge = isPlaceholder
      ? '<span class="badge placeholder">placeholder</span>'
      : `<span class="badge">v${escapeHtml(p.version)}</span>`;
    const tags = (p.keywords || [])
      .map((k) => `<span class="badge">${escapeHtml(k)}</span>`)
      .join("");
    const excerpt = p.readmeExcerpt
      ? `<p class="excerpt">${escapeHtml(p.readmeExcerpt)}</p>`
      : "";

    return `
      <article class="card">
        <h2>${escapeHtml(p.displayName || p.name)}</h2>
        <div class="tags">${versionBadge}${tags}</div>
        <p class="desc">${escapeHtml(p.description || "")}</p>
        ${excerpt}
        <div class="install-row">
          <code>${escapeHtml(p.installCommand)}</code>
        </div>
      </article>
    `;
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
    }[c]));
  }

  render();
</script>
</body>
</html>
